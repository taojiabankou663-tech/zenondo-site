<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>御告げ｜然穏道</title>
<meta name="description" content="然穏道の御告げ。教祖アロエのことば。">

<meta property="og:type" content="website">
<meta property="og:site_name" content="然穏道">
<meta property="og:title" content="然穏道 ― 無理をしない、という選択。">
<meta property="og:description" content="然穏道では、自然・他人という概念を軸として、現世での平穏を追求します。">
<meta property="og:image" content="og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="ja_JP">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="然穏道 ― 無理をしない、という選択。">
<meta name="twitter:description" content="自然・他人という概念を軸として、現世での平穏を追求する。">
<meta name="twitter:image" content="og-image.png">

<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@200;300;400;500;600;700&family=Zen+Old+Mincho:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EEEAE1;
    --paper-deep:#E3DDD0;
    --ink:#1D1B18;
    --ink-soft:#3A3733;
    --stone:#6E6F69;
    --stone-dark:#4B4C47;
    --mist:#AFACA2;
    --mist2:#B8B4A9;
    --accent:#3F4A48;
    --hair:#CBC5B7;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Serif JP', serif;
    font-weight:300;
    line-height:1.9;
    overflow-x:hidden;
  }
  ::selection{background:var(--ink); color:var(--paper);}

  a{color:inherit; text-decoration:none;}

  .label{
    font-family:'Zen Kaku Gothic New', sans-serif;
    letter-spacing:0.24em;
    font-size:11px;
    color:var(--stone);
    font-weight:400;
  }

  /* NAV */
  nav{
    position:fixed; top:0; left:0; right:0; z-index:100;
    display:flex; align-items:center; justify-content:space-between;
    padding:22px 6vw;
    background:rgba(238,234,225,0.86);
    backdrop-filter:blur(6px);
    border-bottom:1px solid transparent;
    transition:border-color .4s ease, background .4s ease;
  }
  nav.scrolled{border-bottom:1px solid var(--hair);}
  .nav-mark{
    font-family:'Zen Old Mincho', serif;
    font-size:18px;
    letter-spacing:0.1em;
    font-weight:500;
  }
  .nav-links{display:flex; gap:38px;}
  .nav-links a{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:13px;
    letter-spacing:0.14em;
    color:var(--ink-soft);
    position:relative;
    padding-bottom:4px;
  }
  .nav-links a::after{
    content:''; position:absolute; left:0; bottom:0; width:0; height:1px;
    background:var(--ink); transition:width .35s ease;
  }
  .nav-links a:hover::after{width:100%;}
  .nav-toggle{display:none;}

  /* HERO */
  .hero{
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    position:relative;
    padding:120px 6vw 80px;
  }
  .ripple-field{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    pointer-events:none;
    opacity:0.5;
  }
  .ripple-field svg{width:min(90vw,900px); height:min(90vw,900px);}
  .ripple-field circle{
    fill:none; stroke:var(--stone); stroke-width:0.6;
    transform-origin:center;
    animation:expand 9s ease-out infinite;
    opacity:0;
  }
  .ripple-field circle:nth-child(1){animation-delay:0s;}
  .ripple-field circle:nth-child(2){animation-delay:3s;}
  .ripple-field circle:nth-child(3){animation-delay:6s;}
  @keyframes expand{
    0%{r:20; opacity:0.55; stroke-width:1.1;}
    70%{opacity:0.12;}
    100%{r:420; opacity:0; stroke-width:0.2;}
  }

  .hero-inner{
    position:relative; z-index:2;
    display:flex; align-items:center; gap:6vw;
    max-width:1100px; width:100%;
    flex-wrap:wrap; justify-content:center;
  }
  .hero-stone{
    width:min(50vw, 340px); height:min(50vw,340px);
    display:flex; align-items:center; justify-content:center;
    position:relative;
    flex-shrink:0;
  }
  .hero-stone svg{
    width:100%; height:100%;
    filter:drop-shadow(0 25px 45px rgba(0,0,0,0.18));
  }
  .hero-text{
    flex:1; min-width:280px;
  }
  .hero-title-vert{
    writing-mode:vertical-rl;
    text-orientation:upright;
    font-family:'Zen Old Mincho', serif;
    font-weight:600;
    font-size:clamp(40px,6vw,64px);
    letter-spacing:0.18em;
    color:var(--ink);
    height:340px;
    display:inline-block;
    margin-bottom:28px;
  }
  .hero-reading{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:13px;
    letter-spacing:0.3em;
    color:var(--stone);
    margin-bottom:18px;
    display:block;
  }
  .hero-copy{
    font-family:'Zen Old Mincho', serif;
    font-size:clamp(20px,2.4vw,27px);
    font-weight:500;
    line-height:1.7;
    color:var(--ink-soft);
    margin-bottom:20px;
  }
  .hero-sub{
    font-size:15px;
    color:var(--stone-dark);
    max-width:34ch;
    font-weight:300;
  }
  .scroll-cue{
    position:absolute; bottom:36px; left:50%; transform:translateX(-50%);
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:11px; letter-spacing:0.3em; color:var(--stone);
    display:flex; flex-direction:column; align-items:center; gap:10px;
  }
  .scroll-cue .line{width:1px; height:34px; background:var(--stone); position:relative; overflow:hidden;}
  .scroll-cue .line::after{
    content:''; position:absolute; top:-100%; left:0; width:100%; height:100%;
    background:var(--ink); animation:drip 2.2s ease-in-out infinite;
  }
  @keyframes drip{ 0%{top:-100%;} 100%{top:100%;} }

  /* SECTION SHELL */
  section{
    padding:120px 6vw;
    position:relative;
  }
  .section-head{
    display:flex; align-items:baseline; gap:20px; margin-bottom:64px;
    max-width:1100px; margin-left:auto; margin-right:auto;
  }
  .section-num{
    font-family:'Zen Old Mincho', serif;
    font-size:15px; color:var(--stone);
    letter-spacing:0.1em;
  }
  .section-title{
    font-family:'Zen Old Mincho', serif;
    font-size:clamp(26px,3.4vw,38px);
    font-weight:600;
    letter-spacing:0.06em;
  }
  .section-title small{
    display:block;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:12px; font-weight:400; letter-spacing:0.2em;
    color:var(--stone); margin-top:8px;
  }
  .section-lede{
    max-width:1100px; margin:0 auto 56px;
    font-family:'Zen Old Mincho', serif;
    font-size:17px; color:var(--ink-soft);
    border-left:2px solid var(--hair);
    padding-left:24px;
    max-width:56ch;
  }

  .alt{background:var(--paper-deep);}

  /* KYOTEN chapters */
  .chapters{
    max-width:1100px; margin:0 auto;
    display:grid; grid-template-columns:1fr 1fr; gap:0;
    border-top:1px solid var(--hair);
  }
  .chapter{
    border-bottom:1px solid var(--hair);
    padding:26px 24px 26px 0;
    display:flex; gap:22px;
    cursor:default;
    transition:background .3s ease;
  }
  .chapter:nth-child(odd){border-right:1px solid var(--hair); padding-right:26px;}
  .chapter:nth-child(even){padding-left:26px;}
  .chapter:hover{background:rgba(0,0,0,0.02);}
  .chapter-num{
    font-family:'Zen Old Mincho', serif;
    font-size:22px; color:var(--stone);
    flex-shrink:0; width:28px;
  }
  .chapter-body h3{
    font-family:'Zen Old Mincho', serif;
    font-size:18px; font-weight:600; margin-bottom:8px;
    letter-spacing:0.03em;
  }
  .chapter-body p{
    font-size:13.5px; color:var(--stone-dark); line-height:1.8; font-weight:300;
  }

  /* JIKKYO */
  .shokai-grid{
    max-width:1100px; margin:0 auto;
    display:grid; grid-template-columns:1fr 1fr; gap:44px;
  }
  .shokai-card{
    border:1px solid var(--hair);
    padding:36px 32px;
    background:var(--paper);
  }
  .shokai-card .kai-num{
    font-family:'Zen Old Mincho', serif;
    font-size:13px; color:var(--stone); letter-spacing:0.1em; margin-bottom:14px; display:block;
  }
  .shokai-card h4{
    font-family:'Zen Old Mincho', serif;
    font-size:19px; font-weight:600; margin-bottom:16px;
  }
  .shokai-card p{font-size:14px; color:var(--ink-soft); font-weight:300;}

  /* GIREI */
  .girei-wrap{
    max-width:1100px; margin:0 auto;
    display:grid; grid-template-columns:1fr 1fr; gap:60px;
  }
  .girei-item{position:relative; padding-top:26px;}
  .girei-item .mark{
    position:absolute; top:0; left:0;
    font-family:'Zen Old Mincho', serif; font-size:13px; color:var(--stone);
    letter-spacing:0.2em;
  }
  .girei-item h4{
    font-family:'Zen Old Mincho', serif;
    font-size:24px; font-weight:600; margin-bottom:18px;
  }
  .girei-item p{font-size:14.5px; color:var(--ink-soft); font-weight:300; margin-bottom:10px;}

  /* YURAI */
  .yurai-wrap{max-width:760px; margin:0 auto;}
  .yurai-wrap p{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-weight:300;
    font-size:15.5px;
    color:var(--ink-soft);
    margin-bottom:22px;
  }
  .yurai-sign{
    margin-top:44px;
    font-family:'Zen Old Mincho', serif;
    font-size:14px; color:var(--stone);
    text-align:right;
  }

  /* FOOTER */
  footer{
    padding:90px 6vw 50px;
    background:var(--ink);
    color:var(--paper);
    text-align:center;
  }
  footer .foot-mark{
    font-family:'Zen Old Mincho', serif;
    font-size:22px; letter-spacing:0.16em; margin-bottom:22px;
  }
  footer p{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:13px; color:#B9B6AC; font-weight:300;
    max-width:44ch; margin:0 auto 30px; line-height:2;
  }
  footer .foot-links{
    display:flex; gap:28px; justify-content:center; margin-bottom:40px;
  }
  footer .foot-links a{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:12px; letter-spacing:0.14em; color:#D8D5CB;
    border-bottom:1px solid rgba(255,255,255,0.25); padding-bottom:3px;
  }
  footer .copyright{font-size:11px; color:#6E6C64; letter-spacing:0.1em;}

  @media (max-width:820px){
    .nav-links{display:none;}
    .hero-inner{flex-direction:column; text-align:center;}
    .hero-title-vert{height:auto; writing-mode:horizontal-tb; letter-spacing:0.14em;}
    .chapters{grid-template-columns:1fr;}
    .chapter:nth-child(odd){border-right:none; padding-right:0;}
    .chapter:nth-child(even){padding-left:0;}
    .shokai-grid, .girei-wrap{grid-template-columns:1fr; gap:28px;}
    section{padding:90px 6vw;}
  }

  .reveal{
    opacity:1; transform:translateY(0);
  }
  .reveal.pre{
    opacity:0; transform:translateY(18px);
    transition:opacity .9s ease, transform .9s ease;
  }
  .reveal.pre.in{opacity:1; transform:translateY(0);}

  .fulltext-link{
    display:block;
    width:fit-content;
    margin:8px auto 56px;
    background:none; border:none; cursor:pointer;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:13px; letter-spacing:0.18em; color:var(--ink);
    border-bottom:1px solid var(--ink);
    padding-bottom:5px;
    position:relative; z-index:5;
  }
  .kyoten-lede-wrap{
    max-width:1100px; margin:0 auto 56px;
    display:flex; align-items:flex-end; justify-content:space-between; gap:24px;
    flex-wrap:wrap;
  }

  /* FULLTEXT MODAL */
  .fulltext-overlay{
    position:fixed; inset:0; z-index:1000;
    background:rgba(29,27,24,0.6);
    display:none;
    align-items:flex-start; justify-content:center;
    padding:6vh 4vw;
    overflow-y:auto;
  }
  .fulltext-overlay.open{display:flex;}
  .fulltext-panel{
    background:var(--paper);
    max-width:760px; width:100%;
    padding:56px 8vw 80px;
    position:relative;
    border:1px solid var(--hair);
    box-shadow:0 40px 80px -20px rgba(0,0,0,0.35);
  }
  .fulltext-close{
    position:sticky; top:0; float:right;
    background:var(--paper); border:1px solid var(--hair);
    width:38px; height:38px; border-radius:50%;
    font-family:'Zen Kaku Gothic New', sans-serif; font-size:16px;
    cursor:pointer; color:var(--ink);
    display:flex; align-items:center; justify-content:center;
  }
  .fulltext-panel h2.ft-title{
    font-family:'Zen Old Mincho', serif;
    font-size:28px; font-weight:600; margin-bottom:8px; letter-spacing:0.08em;
  }
  .fulltext-panel .ft-sub{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:12px; color:var(--stone); letter-spacing:0.16em;
    margin-bottom:48px; display:block;
  }
  .ft-chapter{margin-bottom:44px;}
  .ft-chapter h3{
    font-family:'Zen Old Mincho', serif;
    font-size:19px; font-weight:600;
    margin-bottom:14px;
    padding-bottom:10px;
    border-bottom:1px solid var(--hair);
  }
  .ft-chapter p{
    font-size:14.5px; color:var(--ink-soft); font-weight:300;
    margin-bottom:12px; white-space:pre-line;
  }
  .ft-chapter h4{
    font-family:'Zen Old Mincho', serif;
    font-size:15.5px; font-weight:600; margin:18px 0 8px;
  }
  .ft-list{list-style:none;}
  .ft-list li{
    font-size:14.5px; color:var(--ink-soft); font-weight:300;
    margin-bottom:8px; padding-left:1.6em; text-indent:-1.6em;
  }
  .ft-note{margin-top:16px; padding-top:14px; border-top:1px dashed var(--hair);}
  .ft-note p{font-size:13px; color:var(--stone-dark);}
  @media (max-width:640px){
    .fulltext-panel{padding:44px 7vw 60px;}
  }
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
    .reveal, .reveal.pre{opacity:1 !important; transform:none !important;}
  }

  /* OKOTAGE */
  #okotage{padding:120px 10vw 130px;}
  .okotage-list{max-width:820px;margin:54px auto 0;}
  .okotage-entry{padding:34px 0 38px;border-top:1px solid var(--hair);}
  .okotage-entry:last-child{border-bottom:1px solid var(--hair);}
  .okotage-meta{font-family:'Zen Kaku Gothic New',sans-serif;font-size:11px;letter-spacing:.18em;color:var(--stone);margin-bottom:12px;}
  .okotage-entry h3{font-family:'Zen Old Mincho',serif;font-size:22px;font-weight:500;letter-spacing:.08em;margin-bottom:18px;}
  .okotage-entry p{font-size:15px;line-height:2.15;color:var(--ink-soft);white-space:pre-line;}
  .okotage-entry .okotage-sign{margin-top:20px;text-align:right;font-size:13px;color:var(--stone-dark);}
  @media(max-width:640px){
    #okotage{padding:88px 7vw 96px;}
    .okotage-entry{padding:28px 0 30px;}
    .okotage-entry h3{font-size:20px;}
    .okotage-entry p{font-size:14px;}
  }

</style>
</head>
<body>
<nav id="nav">
  <a class="nav-mark" href="index.html">然穏道</a>
  <div class="nav-links">
    <a href="index.html">ホームへ戻る</a>
  </div>
</nav>
<main><section id="okotage" class="alt">
  <div class="section-head reveal">
    <span class="section-num">陸</span>
    <h2 class="section-title">御告げ<small>OKOTAGE — 教祖のことば</small></h2>
  </div>
  <p class="section-lede reveal">日々の気づきや、教祖からのおことば。</p>
  <div class="okotage-list reveal" id="okotage-list" aria-live="polite">
    <p>御告げを読み込んでいます。</p>
  </div>
</section></main>
<footer class="okotage-footer">
  <a href="index.html">然穏道トップページへ戻る</a>
  <p>自然に穏やかでありますように。</p>
</footer>
<style>
  #okotage{padding:150px 8vw 110px; min-height:80vh;}
  .okotage-footer{
    padding:38px 6vw 50px;
    text-align:center;
    color:var(--stone);
    font-family:'Zen Kaku Gothic New',sans-serif;
    font-size:12px;
    letter-spacing:.12em;
  }
  .okotage-footer a{border-bottom:1px solid var(--hair);padding-bottom:5px;}
  .okotage-footer p{margin-top:20px;font-family:'Zen Old Mincho',serif;letter-spacing:.08em;}
  @media(max-width:640px){
    nav{padding:18px 6vw;}
    #okotage{padding:112px 7vw 80px;}
    .nav-links{gap:0;}
  }
</style>
<script>
  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, (ch) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[ch]);
  }
  fetch('okotage.json')
    .then((response) => {
      if (!response.ok) throw new Error('御告げデータを読み込めませんでした');
      return response.json();
    })
    .then((data) => {
      const entries = Array.isArray(data.entries) ? data.entries : [];
      const list = document.getElementById('okotage-list');
      if (!entries.length) {
        list.innerHTML = '<p>現在、御告げはありません。</p>';
        return;
      }
      list.innerHTML = entries.map((entry) => `
        <article class="okotage-entry">
          <div class="okotage-meta">${escapeHtml(entry.label)}</div>
          <h3>${escapeHtml(entry.title)}</h3>
          <p>${escapeHtml(entry.body).replace(/\n/g, '<br>')}</p>
          ${entry.signature ? `<p class="okotage-sign">${escapeHtml(entry.signature)}</p>` : ''}
        </article>
      `).join('');
    })
    .catch(() => {
      document.getElementById('okotage-list').innerHTML = '<p>御告げを読み込めませんでした。時間をおいて再度お試しください。</p>';
    });

  const nav = document.getElementById('nav');
  window.addEventListener('scroll', () => {
    nav.classList.toggle('scrolled', window.scrollY > 40);
  });
</script>
</body>
</html>
